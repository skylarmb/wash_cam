[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wash-cam"
version = "0.1.0"
description = "A CLI for car wash monitoring."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wash-cam = "wash_cam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
