[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wash-cam"
version = "0.1.0"
description = "A CLI for car wash monitoring."
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "werkzeug>=3.1",
]

[project.scripts]
wash-cam = "wash_cam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
    "numpy>=2.2.6",
    "pytest>=9.1.1",
]
